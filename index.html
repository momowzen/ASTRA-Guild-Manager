<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASTRA Guild Manager</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">

  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
</head>
<body>

<div class="app-container">

  <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo"><img src="assets/logo.png" alt="ASTRA" class="sidebar-logo-img"></div>
        <span class="sidebar-title">ASTRA</span>
      </div>
    <nav class="sidebar-nav">
      <div class="nav-item nav-active" data-page="dashboard">
        <span class="nav-icon">📊</span>
        <span class="nav-label" data-i18n="menuDashboard">Dashboard</span>
      </div>
      <div class="nav-item" data-page="attendance">
        <span class="nav-icon">✅</span>
        <span class="nav-label" data-i18n="menuAttendance">Attendance</span>
      </div>
      <div class="nav-item" data-page="ranking">
        <span class="nav-icon">🏆</span>
        <span class="nav-label" data-i18n="menuRanking">Ranking</span>
      </div>
      <div class="nav-item" data-page="members">
        <span class="nav-icon">👥</span>
        <span class="nav-label" data-i18n="menuMembers">Members</span>
      </div>
      <div class="nav-item" data-page="bossConfig">
        <span class="nav-icon">👹</span>
        <span class="nav-label" data-i18n="menuBossConfig">Boss Config</span>
      </div>
      <div class="nav-item" data-page="history">
        <span class="nav-icon">📋</span>
        <span class="nav-label" data-i18n="menuHistory">History</span>
      </div>
    </nav>
  </aside>

  <div class="main-content">

    <header class="topbar">
      <div class="topbar-left">
        <span class="topbar-title" data-i18n="topbarTitle">Guild Manager</span>
      </div>
      <div class="topbar-right">
        <button class="topbar-btn" id="langToggle">EN</button>
      </div>
    </header>

    <div class="page-container">

      <div id="dashboardPage" class="page page-active"></div>
      <div id="attendancePage" class="page"></div>
      <div id="rankingPage" class="page"></div>
      <div id="membersPage" class="page"></div>
      <div id="bossConfigPage" class="page"></div>
      <div id="historyPage" class="page"></div>

    </div>

  </div>

</div>

<div class="toast-container"></div>

<script src="js/bosses.js"></script>
<script src="js/language.js"></script>
<script src="js/utils.js"></script>
<script src="js/config.js"></script>
<script src="js/firebase.js"></script>
<script src="js/ocr.js"></script>
<script src="js/members.js"></script>
<script src="js/ranking.js"></script>
<script src="js/boss-config.js"></script>
<script src="js/history.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/attendance.js"></script>
<script src="js/app.js"></script>

</body>
</html>
